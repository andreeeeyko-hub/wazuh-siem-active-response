<!-- Active Response Configuration Snippet for Wazuh Manager -->
<!-- File location on Manager: /var/ossec/etc/ossec.conf -->

<ossec_config>
  <!-- Command definition for firewall-drop script -->
  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!-- Active Response trigger configuration -->
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rule_id>100001</rule_id>
    <timeout>60</timeout>
  </active-response>
</ossec_config>
